<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamRadar India - Dashboard</title>
  <meta name="description" content="Personalized Indian government job and competitive examination notification discovery dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { max-width: 960px; margin: 0 auto; }
    .dashboard-layout { display: flex; flex-direction: column; min-height: 100vh; }
    .sidebar-nav { display: flex; gap: 4px; padding: 8px 16px; background: var(--bg-primary); border-bottom: 1px solid var(--border-color); overflow-x: auto; }
    .sidebar-nav button { white-space: nowrap; }
    .content-area { flex: 1; }
    .section-title { font-size: 16px; font-weight: 700; padding: 16px 16px 8px; color: var(--text-primary); }
    .sources-container { padding: 16px; overflow-x: auto; }
    .profile-container { padding: 16px; max-width: 640px; }
    .back-btn { margin: 12px 16px; }
    @media (min-width: 768px) {
      .header-stats { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="dashboard-layout">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="header-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            <path d="M11 8v6M8 11h6"/>
          </svg>
          <h1>ExamRadar India</h1>
        </div>
        <div class="header-actions">
          <button class="btn-icon" id="refreshBtn" title="Refresh">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
          </button>
          <button class="btn-icon" id="themeBtn" title="Toggle Theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="header-stats" id="headerStats">
        <div class="stat-card"><span class="stat-value" id="statOpen">-</span><span class="stat-label">Open</span></div>
        <div class="stat-card"><span class="stat-value" id="statNew">-</span><span class="stat-label">New</span></div>
        <div class="stat-card"><span class="stat-value" id="statMatch">-</span><span class="stat-label">Match</span></div>
        <div class="stat-card"><span class="stat-value" id="statClosing">-</span><span class="stat-label">Closing</span></div>
      </div>
      <div class="last-updated" id="lastUpdated">Loading...</div>
    </header>

    <!-- Navigation -->
    <nav class="sidebar-nav" id="sideNav">
      <button class="btn btn-sm btn-primary" data-view="dashboard">Dashboard</button>
      <button class="btn btn-sm btn-ghost" data-view="all">All Notifications</button>
      <button class="btn btn-sm btn-ghost" data-view="saved">Saved</button>
      <button class="btn btn-sm btn-ghost" data-view="profile">Profile</button>
      <button class="btn btn-sm btn-ghost" data-view="sources">Sources</button>
      <button class="btn btn-sm btn-ghost" data-view="settings">Settings</button>
    </nav>

    <!-- Content Area -->
    <div class="content-area" id="contentArea">
      <!-- Populated by JavaScript -->
    </div>
  </div>

  <script src="api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
