services:
  - type: web
    name: examradar-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: DISCOVERY_ENABLED
        value: "true"
      - key: DISCOVERY_INTERVAL_MINUTES
        value: "60"
